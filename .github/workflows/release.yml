name: Release DroidDesk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish .\src\DroidDesk\DroidDesk.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output .\artifacts\publish
      - shell: pwsh
        run: Compress-Archive -Path .\artifacts\publish\* -DestinationPath .\artifacts\DroidDesk-win-x64.zip -Force
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
        shell: pwsh
        run: |
          gh release create $env:TAG .\artifacts\DroidDesk-win-x64.zip --repo ${{ github.repository }} --title "DroidDesk $env:TAG" --notes "Windows x64 portable build. Extract and run DroidDesk.exe. Android runtime setup is provided in-app." --target ${{ github.sha }}
